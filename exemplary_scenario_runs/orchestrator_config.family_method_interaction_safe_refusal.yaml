    gemma2_9b_base:
      model_name_or_path: google/gemma-2-9b-it
      tokenizer_name_or_path: null
      revision: main
      trust_remote_code: false
      template: gemma

  datasets:
    pku_safe_refusal_sft_train:
      stage: alignment
      path: ../data/pku_safe_refusal_sft_train.jsonl
      format: jsonl
      schema: prompt_response
      fields:
        prompt: prompt
        response: response
        system: null

    pku_safe_refusal_dpo_train:
      stage: alignment
      path: ../data/pku_safe_refusal_dpo_train.jsonl
      format: jsonl
      schema: prompt_chosen_rejected
      fields:
        prompt: prompt
        chosen: chosen
        rejected: rejected
        system: null

    pku_safe_refusal_kto_train:
      stage: alignment
      path: ../data/pku_safe_refusal_kto_train.jsonl
      format: jsonl
      schema: prompt_response_label
      fields:
        prompt: prompt
        response: response
        label: label
        system: null

    do_not_answer_refusal_eval:
      stage: inference_eval
      path: ../benchmark_data/do_not_answer_refusal_eval.jsonl
      format: jsonl
      fields:
        id: id
        input: input
        expected_output: expected_output
        context: null
        retrieval_context: null
        metadata: metadata

    pku_safe_benign_action_eval:
      stage: inference_eval
      path: ../benchmark_data/pku_safe_benign_action_eval.jsonl
      format: jsonl
      fields:
        id: id
        input: input
        expected_output: expected_output
        context: null
        retrieval_context: null
        metadata: metadata

    helpsteer2_benign_open_eval:
      stage: inference_eval
      path: ../benchmark_data/helpsteer2_benign_open_eval.jsonl
      format: jsonl
      fields:
        id: id
        input: input
        expected_output: expected_output
        context: null
        retrieval_context: null
        metadata: metadata

  judge_models:
    qwen25_05b_judge:
      backend: transformers_local
      model: Qwen/Qwen2.5-0.5B-Instruct
      device: cuda
      torch_dtype: bfloat16
      temperature: 0
      generation_kwargs:
        max_new_tokens: 384

  training_profiles:
    pku_safe_refusal_sft:
      training:
        learning_rate: 5.0e-5
        num_train_epochs: 1.0

    pku_safe_refusal_dpo:
      training:
        learning_rate: 1.0e-5
        num_train_epochs: 1.0

    pku_safe_refusal_kto:
      training:
        learning_rate: 1.0e-5
        num_train_epochs: 1.0

  metric_sets:
    exact_only:
      metrics:
        - name: exact_match
          include_reason: true
          strict_mode: false
          verbose_mode: false

    benign_relevancy_qwen_judge:
      judge_model_ref: qwen25_05b_judge
      metrics:
        - name: answer_relevancy
          threshold: 0.5
          include_reason: true
          strict_mode: false
          verbose_mode: false


