# Family x method interaction study on the safe-refusal scenario.
#
# This config reuses the derived datasets from `prepare_safe_refusal_scenario_data.py`.
# Download and prepare them first:
#   python -m orchestrator.cli --dataset PKU-Alignment/PKU-SafeRLHF --split train
#   python -m orchestrator.cli --dataset PKU-Alignment/PKU-SafeRLHF --split test
#   python -m orchestrator.cli --dataset LibrAI/do-not-answer --split train
#   python -m orchestrator.cli --dataset nvidia/HelpSteer2 --split train
#   python -m orchestrator.cli --dataset nvidia/HelpSteer2 --split validation
#   python prepare_safe_refusal_scenario_data.py
#
# This matrix intentionally keeps:
# - one shared training source family (PKU-SafeRLHF-derived SFT / DPO / KTO views)
# - one shared harmful exact-match benchmark
# - one shared benign exact-match benchmark
# - one shared benign answer-relevancy benchmark
#
# Family members:
# - Qwen:      0.5B, 3B, 7B
# - Mistral:   7B v0.2, 7B v0.3, Ministral 8B
# - Gemma:     2B, 9B
#
# Template note:
# The local repo already exercises `qwen`. `mistral` and `gemma` are passed
# through to LLaMA-Factory and should be validated in the target runtime.

orchestrator:
  run_name: family-method-interaction-safe-refusal
  stop_on_error: true

  execute:
    alignment: true
    inference: true
    evaluation: true

  output:
    root_dir: ../../runs/orchestrator
    overwrite: true
    save_pipeline_state: true
    save_generated_stage_configs: true

  naming:
    branch_id_template: "{candidate_id}/{benchmark_id}"
    include_timestamp: true


defaults:
  runtime:
    target: single_gpu
    device: cuda
    cpu_threads: 8
    mixed_precision: bf16
    cuda_visible_devices: []

  alignment:
    backend: llama_factory

    runtime:
      command_mode: module
      python_executable: null
      force_torchrun: false
      nproc_per_node: 1
      extra_env: {}
      heartbeat_interval_seconds: 30

    tuning:
      finetuning_type: lora
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.05
      lora_target: all
      quantization_bit: null

    training:
      cutoff_len: 512
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-5
      num_train_epochs: 1.0
      lr_scheduler_type: cosine
      warmup_ratio: 0.03
      logging_steps: 25
      save_steps: 250
      save_total_limit: 1
      dataloader_num_workers: 0
      preprocessing_num_workers: 1

    output:
      save_adapter_checkpoint: true
      export_merged_model: true
      export_device: cpu
      overwrite_output_dir: true
      save_only_model: false
      report_to: none

  inference:
    mode: offline

    model:
      backend: transformers_local
      device: cuda
      torch_dtype: bfloat16

    generation:
      max_new_tokens: 256
      temperature: 0.0
      top_p: 1.0
      do_sample: false
      repetition_penalty: 1.0
      stop_strings: []
      add_generation_prompt: true

    execution:
      batch_size: 1
      max_concurrency: 1

  evaluation:
    mode: offline

    execution:
      batch_size: 1
      max_concurrency: 1


